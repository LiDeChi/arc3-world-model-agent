[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcagent"
version = "0.1.0"
description = "ARC-AGI-3 world-model agent and self-tuning training platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT-0"}
authors = [{name = "ARC3 Agent Team"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pandas>=2.2", "plotly>=5.20"]
notebook = ["jupyter>=1.0", "nbformat>=5.10"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["arcagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
